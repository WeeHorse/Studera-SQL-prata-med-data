name: Verify book SQL against MySQL

on:
  pull_request:
    paths:
      - 'content/public/downloads/**/*.sql'
      - 'tests/mysql/**'
      - '.github/workflows/mysql-examples.yml'
  push:
    branches: [main]
    paths:
      - 'content/public/downloads/**/*.sql'
      - 'tests/mysql/**'
      - '.github/workflows/mysql-examples.yml'
  workflow_dispatch:

jobs:
  mysql-examples:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=test-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Install mysql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client
      - name: Import data and verify chapter examples
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-only-password
        run: bash tests/mysql/verify-examples.sh
